apiVersion: v1
kind: ConfigMap
metadata:
  name: wkpoule-observability-config
data:
  # Backend EDOT / OpenTelemetry
  SERVICE_NAME: wkpoule-api
  LOG_LEVEL: INFO
  OTEL_SERVICE_NAME: wkpoule-api
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=prd,service.version=1.9.3
  # Substituted into frontend nginx ECS access log (service inventory / log correlation).
  DEPLOYMENT_ENVIRONMENT: prd
  # OTLP → in-cluster gateway; gateway writes to Elasticsearch with elasticsearch/otel (see otel-collector.yaml).
  OTEL_EXPORTER_OTLP_ENDPOINT: http://wkpoule-otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  # OTLP logging: `configure_logging()` re-attaches the OTel handler after dictConfig (see logging_config.py).

  # Reference endpoints for operators/scripts and future app wiring.
  ELASTIC_APM_SERVER_URL: https://0a07eb70c1a6425b92f4246e00d43cfe.ece.kaposi.net:9243
  ELASTICSEARCH_URL: https://o11y.es.ece.kaposi.net:9243
  KIBANA_URL: https://o11y.kb.ece.kaposi.net:9243

  # Frontend nginx RUM proxy. Browser uses same-origin /rum/…; nginx forwards to this APM Server (Elastic Cloud policy URL).
  RUM_APM_UPSTREAM: https://0a07eb70c1a6425b92f4246e00d43cfe.ece.kaposi.net:9243
  RUM_APM_HOST: 0a07eb70c1a6425b92f4246e00d43cfe.ece.kaposi.net
