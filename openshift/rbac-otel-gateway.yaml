# ServiceAccount + namespace Role so wkpoule-otel gateway can run k8sattributes against workloads in this project.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wkpoule-otel-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wkpoule-otel-gateway-k8sattrs
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [replicasets, deployments, daemonsets, statefulsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wkpoule-otel-gateway-k8sattrs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wkpoule-otel-gateway-k8sattrs
subjects:
  - kind: ServiceAccount
    name: wkpoule-otel-gateway
    namespace: wkpoule-prd
