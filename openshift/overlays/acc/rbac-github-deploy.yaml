# Service account for GitHub Actions CD (start builds + watch rollouts in wkpoule-acc).
# Apply: oc apply -f openshift/overlays/acc/rbac-github-deploy.yaml
# Token for GitHub secret OPENSHIFT_TOKEN:
#   oc create token github-actions-deploy -n wkpoule-acc --duration=8760h
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions-deploy
  namespace: wkpoule-acc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-deploy
  namespace: wkpoule-acc
rules:
  - apiGroups: ["build.openshift.io"]
    resources: ["buildconfigs", "buildconfigs/instantiate", "builds"]
    verbs: ["get", "list", "create", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/rollout"]
    verbs: ["get", "watch"]
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams", "imagestreamtags"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-deploy
  namespace: wkpoule-acc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-actions-deploy
subjects:
  - kind: ServiceAccount
    name: github-actions-deploy
