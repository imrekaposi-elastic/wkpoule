# ServiceAccount + namespace Role so wkpoule-otel gateway can run k8sattributes against workloads in this project.
# Pair with otel-collector.yaml processors.k8sattributes.filter.namespace set to this namespace; otherwise
# the processor uses cluster-scoped watches and OpenShift returns 403 for this ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wkpoule-otel-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wkpoule-otel-gateway-k8sattrs
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  # Namespace is cluster-scoped; a Role may only reference a specific instance (metadata for k8sattributes).
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [wkpoule-prd]
    verbs: [get, watch]
  - apiGroups: ["apps"]
    resources: [replicasets, deployments, daemonsets, statefulsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wkpoule-otel-gateway-k8sattrs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wkpoule-otel-gateway-k8sattrs
subjects:
  - kind: ServiceAccount
    name: wkpoule-otel-gateway
    namespace: wkpoule-prd
