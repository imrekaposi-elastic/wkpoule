apiVersion: v1
kind: Secret
metadata:
  name: wkpoule-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql://wkpoule:changeme@postgres:5432/wkpoule
  JWT_SECRET_KEY: changeme-use-openssl-rand-hex-32
  POSTGRES_USER: wkpoule
  POSTGRES_PASSWORD: changeme
  POSTGRES_DB: wkpoule
  WEATHER_API_KEY: ""
  # Browser URL of the app (must match Route host; use https://). Used for invite links and CORS fallback.
  PUBLIC_APP_URL: https://wc2026.apps.cloud.kaposi.net
  # Optional: comma-separated extra CORS origins. Leave unset to use localhost dev + PUBLIC_APP_URL only.
  CORS_ORIGINS: ""
