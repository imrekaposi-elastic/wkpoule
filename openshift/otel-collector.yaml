apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: wkpoule-otel
spec:
  mode: deployment
  replicas: 1
  serviceAccount: wkpoule-otel-gateway
  # EDOT collector image (OpenTelemetry Operator needs otelcol, not Fleet `elastic-agent`).
  image: docker.elastic.co/elastic-agent/elastic-otel-collector:9.3.2
  env:
    # Same API key style as Elasticsearch; ECE backend EDOT OTLP typically accepts ApiKey here.
    - name: ELASTIC_API_KEY
      valueFrom:
        secretKeyRef:
          name: wkpoule-observability-secrets
          key: ELASTIC_API_KEY
    # ECE: in-cluster gateway forwards OTLP to backend EDOT gateway (not direct ES from this collector).
    - name: EDOT_BACKEND_OTLP_HTTP
      value: http://172.16.64.135:4318
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      # Postgres exporter (sidecar on Service postgres:9187) → gateway → backend OTLP.
      prometheus:
        config:
          scrape_configs:
            - job_name: postgres
              scrape_interval: 30s
              scrape_timeout: 15s
              metrics_path: /metrics
              static_configs:
                # FQDN avoids ambiguous DNS in some OpenShift / multitenant setups.
                - targets: ["postgres.wkpoule-prd.svc.cluster.local:9187"]

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      batch: {}
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        # Required with namespace-scoped Role (rbac-otel-gateway): without this, informers list/watch
        # pods and replicasets cluster-wide and get 403. Must match the project namespace.
        filter:
          namespace: wkpoule-prd
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.cronjob.name
            - k8s.job.name
            - k8s.node.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.start_time
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
      resourcedetection/env:
        detectors: [env]
        timeout: 2s
        override: false
      # Correlate postgres_exporter metrics with service inventory + map (same service.name as DB spans).
      resource/postgres_metrics:
        attributes:
          - action: upsert
            key: service.name
            value: postgresql
          - action: upsert
            key: deployment.environment
            value: prd
          - action: upsert
            key: service.environment
            value: prd
          - action: upsert
            key: service.namespace
            value: wkpoule-prd
          - action: upsert
            key: k8s.namespace.name
            value: wkpoule-prd
          - action: upsert
            key: k8s.deployment.name
            value: postgres
          - action: upsert
            key: service.instance.id
            value: postgresql@wkpoule-prd/postgres
          - action: upsert
            key: db.system
            value: postgresql
      # Default env on OTLP metrics (kubeletstats from wkpoule-otel-infra) for consistent Inventory filters.
      resource/otlp_metrics_env:
        attributes:
          - action: upsert
            key: deployment.environment
            value: prd
      # Derives Elastic infra / K8s dashboard–compatible metrics from OTel kubeletstats (Kibana panels query these).
      # See: https://www.elastic.co/docs/reference/edot-collector/config/configure-metrics-collection
      elasticinframetrics: {}
      # Observability inventory keys on service.name; kubeletstats only adds k8s.*. Map Deployments to the
      # same service.name as OTLP traces / exporters (api: observability-config; frontend: wkpoule-frontend).
      transform/kubelet_service_correlation:
        error_mode: silent
        metric_statements:
          - set(resource.attributes["service.name"], "wkpoule-api") where resource.attributes["k8s.deployment.name"] == "wkpoule-api"
          - set(resource.attributes["service.instance.id"], "wkpoule-api@wkpoule-prd/wkpoule-api") where resource.attributes["k8s.deployment.name"] == "wkpoule-api"
          - set(resource.attributes["service.environment"], "prd") where resource.attributes["k8s.deployment.name"] == "wkpoule-api"
          - set(resource.attributes["service.name"], "wkpoule-frontend") where resource.attributes["k8s.deployment.name"] == "wkpoule-frontend"
          - set(resource.attributes["service.instance.id"], "wkpoule-frontend@wkpoule-prd/wkpoule-frontend") where resource.attributes["k8s.deployment.name"] == "wkpoule-frontend"
          - set(resource.attributes["service.environment"], "prd") where resource.attributes["k8s.deployment.name"] == "wkpoule-frontend"
          - set(resource.attributes["service.name"], "postgresql") where resource.attributes["k8s.deployment.name"] == "postgres"
          - set(resource.attributes["service.instance.id"], "postgresql@wkpoule-prd/postgres") where resource.attributes["k8s.deployment.name"] == "postgres"
          - set(resource.attributes["service.environment"], "prd") where resource.attributes["k8s.deployment.name"] == "postgres"
          - set(resource.attributes["db.system"], "postgresql") where resource.attributes["k8s.deployment.name"] == "postgres"
      # Enrich OTel spans for Elastic Observability / APM UIs (raw OTel ES export is not enough).
      elasticapm: {}

    connectors:
      # Emits derived APM metrics from traces; must be an exporter on the traces pipeline.
      elasticapm: {}

    exporters:
      otlp_http/edot:
        endpoint: ${env:EDOT_BACKEND_OTLP_HTTP}
        tls:
          insecure: true
        compression: gzip
        headers:
          Authorization: "ApiKey ${env:ELASTIC_API_KEY}"

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resourcedetection/env, batch, elasticapm]
          exporters: [elasticapm, otlp_http/edot]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resourcedetection/env, resource/otlp_metrics_env, elasticinframetrics, transform/kubelet_service_correlation, batch]
          exporters: [otlp_http/edot]
        metrics/postgres_exporter:
          receivers: [prometheus]
          processors: [memory_limiter, resource/postgres_metrics, batch]
          exporters: [otlp_http/edot]
        metrics/apm-aggregated:
          receivers: [elasticapm]
          processors: []
          exporters: [otlp_http/edot]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resourcedetection/env, batch]
          exporters: [otlp_http/edot]
