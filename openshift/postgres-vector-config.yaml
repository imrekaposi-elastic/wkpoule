apiVersion: v1
kind: ConfigMap
metadata:
  name: wkpoule-postgres-vector
data:
  vector.yaml: |
    api:
      enabled: true
      address: 0.0.0.0:8686

    sources:
      pg_csv:
        type: file
        # With log_destination=csvlog, PostgreSQL names files *.csv (log_filename .log → .csv).
        include:
          - /pglogs/*.csv
          - /pglogs/*.log
        read_from: beginning
        max_line_bytes: 1048576

    transforms:
      pg_fields:
        type: remap
        inputs: [pg_csv]
        source: |
          .service_name = "postgresql"
          .environment = "prd"
          .log_source = "postgres-csv"

    sinks:
      es:
        type: elasticsearch
        inputs: [pg_fields]
        endpoints:
          - https://o11y.es.ece.kaposi.net:9243
        api_version: v8
        # Vector 0.41 elasticsearch sink only supports auth.strategy basic|aws, not api_key.
        request:
          headers:
            Authorization: "ApiKey ${ELASTIC_API_KEY:?ELASTIC_API_KEY_required}"
        tls:
          verify_certificate: false
        # Classic `bulk.index: name-%Y.%m.%d` creates rolling indices, not data streams.
        # Data stream name becomes: logs-<dataset>-<namespace> (ECS / Observability convention).
        mode: data_stream
        data_stream:
          type: logs
          dataset: wkpoule.postgresql
          namespace: prd
