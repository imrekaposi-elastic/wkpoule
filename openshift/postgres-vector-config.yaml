apiVersion: v1
kind: ConfigMap
metadata:
  name: wkpoule-postgres-vector
data:
  vector.yaml: |
    api:
      enabled: true
      address: 0.0.0.0:8686

    sources:
      pg_csv:
        type: file
        # With log_destination=csvlog, PostgreSQL names files *.csv (log_filename .log → .csv).
        include:
          - /pglogs/*.csv
          - /pglogs/*.log
        read_from: beginning
        max_line_bytes: 1048576
        # Pick up new CSV segments soon after rotation.
        glob_minimum_cooldown_ms: 1000

    transforms:
      pg_fields:
        type: remap
        inputs: [pg_csv]
        source: |
          # Nested ECS + Elastic Observability log grouping (Overview uses event.dataset / data_stream).
          .service.name = "postgresql"
          .deployment.environment = "prd"
          .event.dataset = "postgres.otel"
          .log_source = "postgres-csv"

    sinks:
      es:
        type: elasticsearch
        inputs: [pg_fields]
        endpoints:
          - ${ELASTICSEARCH_URL:?ELASTICSEARCH_URL_required}
        api_version: v8
        # Vector 0.41: no auth.strategy=api_key; use Authorization header (ES ApiKey format).
        request:
          headers:
            Authorization: "ApiKey ${ELASTIC_API_KEY:?ELASTIC_API_KEY_required}"
        tls:
          verify_certificate: false
        # Drop file-source metadata that can break ES dynamic mappings on logs data streams.
        encoding:
          except_fields:
            - host
            - source_type
            - file
        # Classic `bulk.index: name-%Y.%m.%d` creates rolling indices, not data streams.
        # Data stream: logs-postgres.otel-prd — matches Elastic *.otel log naming (not "unknown").
        # Grant the observability API key create/write on this pattern if roles are index-scoped.
        mode: data_stream
        data_stream:
          type: logs
          dataset: postgres.otel
          namespace: prd
