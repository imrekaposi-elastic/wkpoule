apiVersion: v1
kind: ConfigMap
metadata:
  name: wkpoule-postgres-vector
data:
  vector.yaml: |
    api:
      enabled: true
      address: 0.0.0.0:8686

    sources:
      pg_csv:
        type: file
        # Elastic's PostgreSQL integration parses CSV logs natively. Do not ship the paired .log file too,
        # or the same event appears twice with the text-log copy parsed less richly.
        include:
          - /pglogs/*.csv
          # PG may rotate to postgresql-*.csv depending on log_truncate_on_rotation / log_filename.
          - /pglogs/postgresql*.csv
        read_from: beginning
        max_line_bytes: 1048576

    transforms:
      pg_fields:
        type: remap
        inputs: [pg_csv]
        source: |
          # Route PostgreSQL CSV logs into Elastic's native PostgreSQL integration data stream.
          # The package ingest pipeline parses message into postgresql.log.* fields.
          .service.name = "postgresql"
          .deployment.environment = "prd"
          .event.module = "postgresql"
          .event.dataset = "postgresql.log"
          .log_source = "postgres-csv"

    sinks:
      es:
        type: elasticsearch
        inputs: [pg_fields]
        endpoints:
          # URL from pod env ELASTICSEARCH_URL. Do not put shell-style required-var templates in this file;
          # Vector scans the whole config for dollar-brace patterns and will treat them as env interpolation.
          - ${ELASTICSEARCH_URL}
        api_version: v8
        # Vector 0.41: no auth.strategy=api_key; use Authorization header (ES ApiKey format).
        request:
          headers:
            Authorization: "ApiKey ${ELASTIC_API_KEY}"
        tls:
          verify_certificate: false
        # Drop file-source metadata that can break ES dynamic mappings on logs data streams.
        encoding:
          except_fields:
            - host
            - source_type
            - file
        # Native Elastic PostgreSQL integration data stream: logs-postgresql.log-prd.
        # Requires the PostgreSQL integration package assets (pipelines/templates) to be installed.
        mode: data_stream
        data_stream:
          type: logs
          dataset: postgresql.log
          namespace: prd
