# Apply: oc apply -k openshift/
#
# Three runtimes: postgres (pull-only image), wkpoule-api (build context backend/), wkpoule-frontend (context frontend/).
# See openshift/README.md and openshift/examples/buildconfigs-git.yaml for monorepo builds.
#
# Images (build locally, push to internal registry — use your real project if not wkpoule-prd):
#   REG=$(oc registry info --public=false)
#   docker login -u "$(oc whoami)" -p "$(oc whoami -t)" "$REG"
#   docker tag wkpoule-api:latest "$REG/wkpoule-prd/wkpoule-api:latest"
#   docker tag wkpoule-frontend:latest "$REG/wkpoule-prd/wkpoule-frontend:latest"
#   docker push "$REG/wkpoule-prd/wkpoule-api:latest"
#   docker push "$REG/wkpoule-prd/wkpoule-frontend:latest"
#
# If you rename the project, set `namespace:` below and replace `wkpoule-prd` in
# deployment-api.yaml / deployment-frontend.yaml image paths to match.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wkpoule-prd
resources:
  - secret.yaml
  - secret-postgres-otel.yaml
  - observability-config.yaml
  - observability-secret.yaml
  - rbac-otel-gateway.yaml
  - rbac-otel-cluster.yaml
  - otel-collector.yaml
  # DaemonSet: kubeletstats (node/pod/container metrics) → gateway wkpoule-otel → backend EDOT OTLP
  - otel-k8s-infra.yaml
  # Deployment: k8s_cluster (OpenShift) → gateway OTLP (Elastic recommended cluster collector)
  - otel-k8s-cluster.yaml
  - pvc-postgres.yaml
  - imagestreams.yaml
  - postgres-vector-config.yaml
  - deployment-postgres.yaml
  - job-postgres-otel-user.yaml
  - deployment-api.yaml
  - deployment-frontend.yaml
  - route.yaml
