apiVersion: v1
kind: ConfigMap
metadata:
  name: wkpoule-browser-loadtest
data:
  loadtest.js: |
    const { chromium } = require('playwright');

    const baseUrl = process.env.BASE_URL || 'https://wc2026.apps.cloud.kaposi.net';
    const iterations = Number(process.env.ITERATIONS || 80);
    const concurrency = Number(process.env.CONCURRENCY || 4);
    const holdMs = Number(process.env.HOLD_MS || 3500);

    const paths = [
      '/',
      '/login',
      '/standings',
      '/groups',
      '/matches',
    ];

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function runVisit(browser, id) {
      const path = paths[id % paths.length];
      const url = new URL(path, baseUrl).toString();
      const context = await browser.newContext({
        viewport: { width: 1366, height: 768 },
        userAgent:
          `Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 ` +
          `(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36 wkpoule-loadtest/${id}`,
      });
      const page = await context.newPage();
      let rumEvents = 0;

      page.on('console', (message) => {
        if (message.type() === 'error' || message.text().toLowerCase().includes('elastic')) {
          console.log(`visit ${id} console ${message.type()}: ${message.text()}`);
        }
      });
      page.on('requestfailed', (request) => {
        console.log(`visit ${id} request failed ${request.url()}: ${request.failure()?.errorText}`);
      });
      page.on('response', async (response) => {
        const responseUrl = response.url();
        if (responseUrl.includes('/rum/')) {
          rumEvents += 1;
          console.log(`visit ${id} rum response ${response.status()} ${responseUrl}`);
        }
      });

      try {
        await page.goto(url, { waitUntil: 'networkidle', timeout: 45000 });
        await sleep(750);

        for (const y of [300, 900, 1500, 2200, 0]) {
          await page.evaluate((scrollY) => window.scrollTo({ top: scrollY, behavior: 'smooth' }), y);
          await sleep(500);
        }

        await sleep(holdMs);
        await page.close({ runBeforeUnload: true });
        await sleep(1000);
        console.log(`visit ${id} ok ${url} rum_events=${rumEvents}`);
      } catch (error) {
        console.log(`visit ${id} failed ${url}: ${error.message}`);
      } finally {
        await context.close();
      }
    }

    async function main() {
      console.log(`Starting browser load test: ${iterations} visits, concurrency ${concurrency}, ${baseUrl}`);
      const browser = await chromium.launch({
        headless: true,
        args: ['--no-sandbox', '--disable-dev-shm-usage'],
      });

      let next = 0;
      async function worker() {
        while (next < iterations) {
          const id = next++;
          await runVisit(browser, id);
        }
      }

      await Promise.all(Array.from({ length: concurrency }, worker));
      await browser.close();
      console.log('Browser load test complete');
    }

    main().catch((error) => {
      console.error(error);
      process.exit(1);
    });
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wkpoule-browser-loadtest
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: browser-loadtest
          image: mcr.microsoft.com/playwright:v1.56.1-jammy
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /tmp
            - name: npm_config_cache
              value: /tmp/.npm
            - name: PLAYWRIGHT_BROWSERS_PATH
              value: /ms-playwright
            - name: BASE_URL
              value: https://wc2026.apps.cloud.kaposi.net
            - name: ITERATIONS
              value: "120"
            - name: CONCURRENCY
              value: "4"
            - name: HOLD_MS
              value: "10000"
          command: ["/bin/bash", "-lc"]
          args:
            - |
              cd /tmp
              cp /scripts/loadtest.js /tmp/loadtest.js
              npm init -y >/dev/null
              npm install playwright@1.56.1 --omit=dev >/dev/null
              node /tmp/loadtest.js
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: wkpoule-browser-loadtest
        - name: tmp
          emptyDir: {}
