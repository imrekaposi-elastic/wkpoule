apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          args:
            - postgres
            - -c
            - log_destination=stderr,csvlog
            - -c
            - logging_collector=on
            - -c
            - log_directory=/pglogs
            - -c
            - log_filename=postgresql.log
            - -c
            - log_connections=on
            - -c
            - log_disconnections=on
            - -c
            - log_min_duration_statement=1000
            # Default log_file_mode is 0600; vector-logs runs non-root and must read CSV files on the shared volume.
            - -c
            - log_file_mode=0644
          ports:
            - containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: wkpoule-secrets
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: pglogs
              mountPath: /pglogs
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - wkpoule
            initialDelaySeconds: 5
            periodSeconds: 10
        # Prometheus-format metrics → scraped by wkpoule-otel (prometheus receiver) → Elasticsearch.
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9187
              name: metrics
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: wkpoule-secrets
                  key: POSTGRES_EXPORTER_DSN
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
        # Ship CSV logs from /pglogs to Elasticsearch (same cluster as wkpoule-otel).
        - name: vector-logs
          image: docker.io/timberio/vector:0.41.1-debian
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/vector/vector.yaml"]
          env:
            - name: ELASTICSEARCH_URL
              valueFrom:
                configMapKeyRef:
                  name: wkpoule-observability-config
                  key: ELASTICSEARCH_URL
            - name: ELASTIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wkpoule-observability-secrets
                  key: ELASTIC_API_KEY
          ports:
            - containerPort: 8686
              name: vector-api
          volumeMounts:
            - name: pglogs
              mountPath: /pglogs
              readOnly: true
            - name: vector-config
              mountPath: /etc/vector
            - name: vector-data
              mountPath: /var/lib/vector
          readinessProbe:
            tcpSocket:
              port: vector-api
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: wkpoule-postgres-pvc
        - name: pglogs
          emptyDir: {}
        - name: vector-config
          configMap:
            name: wkpoule-postgres-vector
        - name: vector-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
    - name: metrics
      port: 9187
      targetPort: 9187
