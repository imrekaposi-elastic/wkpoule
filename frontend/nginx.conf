# Frontend container: proxies /api to API Service and /rum to the private Elastic APM endpoint.
# Official nginx image runs envsubst on this template — ${API_HOST}, ${RUM_APM_*}, ${DEPLOYMENT_ENVIRONMENT} come from container env.
# Nginx variables ($host, $uri, …) stay as a single $ and must NOT use $$ (that can end up literal and break nginx).

log_format ecs_json escape=json '{'
    '"@timestamp":"$time_iso8601",'
    '"ecs.version":"8.11.0",'
    '"service.name":"wkpoule-frontend",'
    '"deployment.environment":"${DEPLOYMENT_ENVIRONMENT}",'
    '"event.dataset":"nginx.access",'
    '"event.action":"http_request",'
    '"event.category":"web",'
    '"log.level":"info",'
    '"message":"$request",'
    '"client.ip":"$remote_addr",'
    '"source.ip":"$remote_addr",'
    '"http.request.method":"$request_method",'
    '"http.request.bytes":$request_length,'
    '"http.response.status_code":$status,'
    '"http.response.bytes":$body_bytes_sent,'
    '"url.domain":"$host",'
    '"url.path":"$uri",'
    '"url.query":"$args",'
    '"url.original":"$request_uri",'
    '"user_agent.original":"$http_user_agent",'
    '"user.name":"$remote_user",'
    '"network.protocol":"http",'
    '"event.duration_seconds":$request_time'
'}';

access_log /dev/stdout ecs_json;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://${API_HOST}:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Edge TLS terminates at the Route; pod sees HTTP — preserve client scheme for apps and APM.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /rum/ {
        proxy_pass ${RUM_APM_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host ${RUM_APM_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
