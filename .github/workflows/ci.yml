# Runs on GitHub for every push and pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: pytest (unit)
        run: pytest tests/unit -v --cov=app --cov-report=term-missing --cov-fail-under=80

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: pytest (integration)
        run: pytest tests/integration -v

  backend-production-smoke:
    name: Backend production smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install production dependencies only
        run: pip install -r requirements.txt pytest
      - name: pytest (production smoke)
        run: pytest tests/unit/test_app_startup.py -v

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm install
      - name: vitest
        run: npm run test:ci
      - name: Typecheck and production build
        run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (Python)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --desc on
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (JavaScript)
        working-directory: frontend
        run: |
          npm install
          npm audit --omit=dev --audit-level=high

  deploy-acc:
    name: Deploy to acceptance
    runs-on: ubuntu-latest
    needs:
      - backend-unit
      - backend-integration
      - backend-production-smoke
      - frontend-test
      - dependency-audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Install OpenShift CLI
        run: |
          curl -fsSL "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/stable/openshift-client-linux.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oc kubectl
          oc version --client
      - name: Log in to OpenShift
        env:
          OPENSHIFT_API_URL: ${{ secrets.OPENSHIFT_API_URL }}
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        run: |
          oc login "$OPENSHIFT_API_URL" --token="$OPENSHIFT_TOKEN" --insecure-skip-tls-verify=true
          oc project wkpoule-acc
      - name: Build images on cluster
        run: |
          oc start-build wkpoule-api wkpoule-frontend \
            -n wkpoule-acc --wait --follow
      - name: Wait for rollouts
        run: |
          oc rollout status deployment/wkpoule-api -n wkpoule-acc --timeout=10m
          oc rollout status deployment/wkpoule-frontend -n wkpoule-acc --timeout=10m
