# Manual production deploy — use the "Run workflow" button on GitHub Actions.
# Optional approval gate: repo Settings → Environments → production → Required reviewers.

name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to release current main to wkpoule-prd'
        required: true
        type: string

concurrency:
  group: deploy-prd
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-prd:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Confirm deploy
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo 'You must type deploy in the confirm field.'
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install OpenShift CLI
        run: |
          curl -fsSL "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/stable/openshift-client-linux.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oc kubectl
          oc version --client

      - name: Log in to OpenShift
        env:
          OPENSHIFT_API_URL_PRD: ${{ secrets.OPENSHIFT_API_URL_PRD }}
          OPENSHIFT_TOKEN_PRD: ${{ secrets.OPENSHIFT_TOKEN_PRD }}
          OPENSHIFT_API_URL: ${{ secrets.OPENSHIFT_API_URL }}
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        run: |
          set -euo pipefail
          trim() { printf '%s' "$1" | tr -d '\r\n' | xargs; }

          OPENSHIFT_API_URL=$(trim "${OPENSHIFT_API_URL_PRD:-$OPENSHIFT_API_URL}")
          OPENSHIFT_TOKEN=$(trim "${OPENSHIFT_TOKEN_PRD:-$OPENSHIFT_TOKEN}")
          if [ -z "$OPENSHIFT_API_URL" ]; then
            OPENSHIFT_API_URL="https://api.cloud.kaposi.net:6443"
          fi

          if [ -z "$OPENSHIFT_TOKEN" ]; then
            echo "Missing production deploy token."
            echo "Add repository or production environment secret OPENSHIFT_TOKEN_PRD from:"
            echo "  oc extract secret/github-actions-deploy-token -n wkpoule-prd --keys=token --to=-"
            echo "Do not reuse OPENSHIFT_TOKEN from acc — that token cannot start builds in wkpoule-prd."
            exit 1
          fi

          if ! oc login "$OPENSHIFT_API_URL" --token="$OPENSHIFT_TOKEN" --insecure-skip-tls-verify=true; then
            echo "OpenShift login failed. Re-copy OPENSHIFT_TOKEN_PRD from:"
            echo "  oc extract secret/github-actions-deploy-token -n wkpoule-prd --keys=token --to=-"
            echo "Use the long-lived service-account token (not oc whoami -t)."
            exit 1
          fi

          WHOAMI=$(oc whoami)
          echo "Logged in as: $WHOAMI"
          EXPECTED="system:serviceaccount:wkpoule-prd:github-actions-deploy"
          if [ "$WHOAMI" != "$EXPECTED" ]; then
            echo "Wrong token for production deploy."
            echo "Expected: $EXPECTED"
            echo "Got:      $WHOAMI"
            echo "Set OPENSHIFT_TOKEN_PRD from wkpoule-prd (see openshift/README.md)."
            exit 1
          fi

          if ! oc auth can-i create buildconfigs/instantiate -n wkpoule-prd | grep -qx yes; then
            echo "Token cannot start builds in wkpoule-prd."
            echo "Apply cluster RBAC once:"
            echo "  oc apply -f openshift/overlays/prd/rbac-github-deploy.yaml"
            echo "  oc apply -f openshift/overlays/prd/sa-token-github-deploy.yaml"
            exit 1
          fi

      - name: Build images on cluster
        run: |
          # Stagger starts so prd etcd/build load stays manageable (parallel builds overload the cluster).
          oc start-build wkpoule-api -n wkpoule-prd --wait &
          api_pid=$!
          echo "Waiting 2 minutes before starting frontend build…"
          sleep 120
          oc start-build wkpoule-frontend -n wkpoule-prd --wait &
          frontend_pid=$!
          wait "$api_pid" "$frontend_pid"

      - name: Wait for rollouts
        run: |
          oc rollout status deployment/wkpoule-api -n wkpoule-prd --timeout=15m
          oc rollout status deployment/wkpoule-frontend -n wkpoule-prd --timeout=15m

      - name: Verify production health
        run: |
          curl -sf https://wc2026-api.apps.cloud.kaposi.net/api/health
          curl -sf https://wc2026.apps.cloud.kaposi.net/
